<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,900&family=Dela+Gothic+One&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:transparent;}
body.dark{background:#111;}
#w{width:2400px;height:1000px;display:flex;align-items:center;justify-content:center;}
svg{overflow:visible}
</style></head><body>
<div id="w">
<svg width="2200" height="900" viewBox="0 0 2200 900" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#d9dde2"/>
   <stop offset=".5" stop-color="#7c838c"/><stop offset=".58" stop-color="#c7ccd2"/><stop offset="1" stop-color="#f4f6f8"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#c43c00"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#ff6a00" stop-opacity="0"/><stop offset=".25" stop-color="#ff6a00"/><stop offset="1" stop-color="#ffb347"/>
  </linearGradient>
 </defs>
 <!-- speed stripes -->
 <g transform="skewX(-22)">
  <rect x="300" y="168" width="1700" height="18" fill="url(#bar)"/>
  <rect x="520" y="200" width="1480" height="8" fill="url(#bar)" opacity=".8"/>
 </g>
 <!-- HASHIRIYA -->
 <g font-family="'Exo 2'" font-style="italic" font-weight="900" text-anchor="middle">
  <text x="1100" y="470" font-size="300" letter-spacing="6" fill="none" stroke="#0b0b0e" stroke-width="44" stroke-linejoin="round">HASHIRIYA</text>
  <text x="1100" y="470" font-size="300" letter-spacing="6" fill="none" stroke="#ff6a00" stroke-width="16" stroke-linejoin="round">HASHIRIYA</text>
  <text x="1100" y="470" font-size="300" letter-spacing="6" fill="url(#chrome)">HASHIRIYA</text>
 </g>
 <!-- BATTLE plate -->
 <g transform="translate(1100 600) skewX(-22)">
  <rect x="-470" y="-82" width="940" height="164" fill="#0b0b0e"/>
  <rect x="-452" y="-66" width="904" height="132" fill="url(#orange)"/>
 </g>
 <text x="1100" y="648" font-family="'Exo 2'" font-style="italic" font-weight="900" font-size="140" letter-spacing="34" text-anchor="middle" fill="#0b0b0e">BATTLE</text>
 <!-- kanji -->
 <g font-family="'Dela Gothic One'" text-anchor="middle">
  <text x="1100" y="790" font-size="92" letter-spacing="30" fill="none" stroke="#0b0b0e" stroke-width="18" stroke-linejoin="round">走り屋バトル</text>
  <text x="1100" y="790" font-size="92" letter-spacing="30" fill="#f4f6f8">走り屋バトル</text>
 </g>
</svg></div></body></html>

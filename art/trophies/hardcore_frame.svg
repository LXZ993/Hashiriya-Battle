<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Hashiriya Battle: Hardcore-Rahmen. Liegt über Plakette/Pokal (gleiche Größe 200x240), wenn die Trophäe in einem Hardcore-Spielstand gewonnen wurde.
       Ebenen: rahmen (rote Ecken), band (Schrägband oben rechts), schrift (HARDCORE). -->
  <defs>
    <linearGradient id="hcRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a46"/><stop offset=".45" stop-color="#b3221a"/><stop offset=".6" stop-color="#e2392c"/><stop offset="1" stop-color="#6e120d"/>
    </linearGradient>
    <linearGradient id="hcBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b0a"/><stop offset="1" stop-color="#050303"/>
    </linearGradient>
  </defs>
  <g id="rahmen" fill="url(#hcRed)">
    <!-- vier spitze Eckwinkel -->
    <path d="M2 2 L54 2 L46 9 L9 9 L9 46 L2 54 Z"/>
    <path d="M198 2 L146 2 L154 9 L191 9 L191 46 L198 54 Z"/>
    <path d="M2 238 L2 186 L9 194 L9 231 L46 231 L54 238 Z"/>
    <path d="M198 238 L198 186 L191 194 L191 231 L154 231 L146 238 Z"/>
  </g>
  <g id="band">
    <!-- Schrägband über der oberen rechten Ecke (lässt Logo und Gravur frei) -->
    <path d="M112 -4 L146 -4 L204 54 L204 88 Z" fill="url(#hcBand)"/>
    <path d="M112 -4 L117 -4 L204 83 L204 88 Z" fill="url(#hcRed)"/>
    <path d="M141 -4 L146 -4 L204 54 L204 59 Z" fill="url(#hcRed)"/>
  </g>
  <g id="schrift" transform="rotate(45 160 40)">
    <text x="160" y="45" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-style="italic" font-size="12" letter-spacing="1.5" fill="#f4f4f4">HARDCORE</text>
  </g>
</svg>

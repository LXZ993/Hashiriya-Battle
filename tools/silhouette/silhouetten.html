<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hashiriya Silhouetten</title>
<style>
:root {
  --bg: #121419; --panel: #1b1e25; --panel2: #242831; --line: #333845;
  --text: #e6e8ec; --muted: #9aa1ad; --accent: #ff7a1a; --accent2: #ffb347;
  --bad: #ff6b6b; --ok: #5fd38d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 18px; background: var(--panel); border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 5; }
header .brand { font-weight: 700; font-size: 17px; letter-spacing: .4px; }
header .brand span { color: var(--accent); }
header .tag { font-size: 11px; color: var(--accent2); border: 1px solid var(--accent2); border-radius: 4px; padding: 1px 6px; }
header .sp { flex: 1; }
header .stat { color: var(--muted); font-size: 13px; }
header .stat b.bad { color: var(--bad); }
header .stat b.ok { color: var(--ok); }
button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
header button, header input { font-size: 13px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.pri { background: var(--accent); border-color: var(--accent); color: #15171c; font-weight: 600; }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.wrap { display: grid; grid-template-columns: 300px 1fr; gap: 0; min-height: calc(100vh - 54px); }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 54px; height: calc(100vh - 54px); }
aside input, aside select { width: 100%; }
aside input[type=checkbox] { width: auto; }
#list { overflow-y: auto; flex: 1; margin: 0 -4px; }
#list .it { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
#list .it:hover { background: var(--panel2); }
#list .it.sel { background: var(--panel2); outline: 1px solid var(--accent); }
#list .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
#list .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#list .fl { font-size: 10px; color: var(--muted); }
#list .ov { font-size: 10px; color: var(--accent2); }
#list .du { font-size: 10px; color: var(--bad); }
main { padding: 18px 24px 60px; min-width: 0; }
.top { display: grid; grid-template-columns: minmax(300px, 560px) minmax(280px, 1fr); gap: 22px; align-items: start; }

/* TXR-artige Sprechblase in BeamNG-Farben */
.bubble { display: flex; gap: 0; background: linear-gradient(90deg, rgba(14,16,21,.96), rgba(27,30,37,.92)); border: 1px solid var(--line); border-left: 4px solid var(--crew, var(--accent)); border-radius: 4px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
.bubble .por { width: 168px; height: 168px; flex: none; position: relative; }
.bubble .por svg { width: 100%; height: 100%; display: block; }
.bubble .por .badge { position: absolute; top: 6px; left: 6px; font-size: 10px; font-weight: 700; letter-spacing: 1px; padding: 1px 6px; border-radius: 3px; background: var(--crew, var(--accent)); color: #111; }
.bubble .txt { padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bubble .crew { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--crew, var(--accent)); font-weight: 600; }
.bubble .who { font-size: 19px; font-weight: 700; }
.bubble .nick { color: var(--muted); font-size: 13px; margin-top: -4px; }
.bubble .line { margin-top: 6px; font-size: 15px; font-style: italic; border-top: 1px solid var(--line); padding-top: 8px; }
.prevopts { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 10px 0 0; align-items: center; }
.big { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; justify-content: center; }
.big svg { width: 100%; max-width: 420px; height: auto; display: block; border-radius: 4px; }

.parts { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.parts h3 { margin: 0 0 8px; font-size: 15px; color: var(--accent2); }
.parts .row { display: grid; grid-template-columns: 110px 1fr 30px; gap: 8px; align-items: center; margin: 5px 0; }
.parts .row .lbl { color: var(--muted); }
.parts .row.ov .lbl { color: var(--accent2); }
.parts .row select { width: 100%; }
.parts .row button { padding: 4px 0; }
.parts .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.parts .sig { margin-top: 10px; font-size: 12px; color: var(--muted); word-break: break-all; }
.parts .sig.bad { color: var(--bad); }
.hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

h2 { font-size: 17px; margin: 30px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; display: flex; gap: 12px; align-items: baseline; }
h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
#grid .c { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px; cursor: pointer; text-align: center; }
#grid .c:hover { border-color: var(--accent); }
#grid .c.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
#grid .c.dup { border-color: var(--bad); }
#grid .c svg { width: 100%; height: auto; display: block; border-radius: 3px; }
#grid .c .n { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel2); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr; }
  aside { position: static; height: 360px; }
  .top { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="brand">HASHIRIYA <span>BATTLE</span> · Silhouetten</div>
  <span class="tag">Prototyp, noch nicht im Spiel</span>
  <div class="sp"></div>
  <span class="stat" id="stat"></span>
  <label class="chk" title="Ändert alle automatischen Silhouetten auf einmal">Seed <input id="seed" style="width:130px"></label>
  <button id="btnExportJson" title="Deine Änderungen als Datei speichern">Änderungen exportieren</button>
  <button id="btnImportJson">Importieren</button>
  <button id="btnLoadRivals" title="Aktuelle rivals.json aus dem Mod-Ordner laden">rivals.json laden</button>
  <input type="file" id="fileJson" accept=".json" hidden>
  <input type="file" id="fileRivals" accept=".json" hidden>
</header>

<div class="wrap">
  <aside>
    <input id="search" placeholder="Name, Spitzname oder ID suchen">
    <select id="crewFilter"></select>
    <label class="chk"><input type="checkbox" id="onlyOv"> nur geänderte</label>
    <label class="chk"><input type="checkbox" id="onlyDup"> nur doppelte</label>
    <div id="list"></div>
  </aside>
  <main>
    <div class="top">
      <div>
        <div class="bubble" id="bubble">
          <div class="por" id="por"></div>
          <div class="txt">
            <div class="crew" id="bCrew"></div>
            <div class="who" id="bName"></div>
            <div class="nick" id="bNick"></div>
            <div class="line" id="bLine"></div>
          </div>
        </div>
        <div class="prevopts">
          <select id="lineType">
            <option value="challenge">Herausforderung</option>
            <option value="win">Gegner gewinnt</option>
            <option value="lose">Gegner verliert</option>
          </select>
          <select id="lang"><option value="de">Deutsch</option><option value="en">English</option></select>
          <label class="chk"><input type="checkbox" id="showBg" checked> Hintergrund</label>
        </div>
        <div class="big" id="big"></div>
      </div>
      <div class="parts">
        <h3 id="pTitle">Teile</h3>
        <div id="rows"></div>
        <div class="sig" id="sig"></div>
        <div class="btns">
          <button id="btnReset">Alles auf Auto</button>
          <button id="btnRandom">Zufällig</button>
          <button id="btnPrev">◀</button>
          <button id="btnNext">▶</button>
        </div>
        <div class="btns">
          <select id="pngSize"><option>256</option><option selected>512</option><option>1024</option></select>
          <button class="pri" id="btnPng">PNG speichern</button>
          <button id="btnPngAll" title="Alle gefilterten Gegner als ZIP (braucht Internet für JSZip)">Alle als ZIP</button>
        </div>
        <div class="hint">Orange beschriftete Teile hast du selbst gewählt. "Auto" heißt: aus der Gegner-ID berechnet, bleibt immer gleich. Änderungen werden im Browser gemerkt; mit "Änderungen exportieren" sicherst du sie als Datei.</div>
      </div>
    </div>
    <h2>Alle Gegner <small id="gridInfo"></small></h2>
    <div id="grid"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="rivals_data.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Daten
// ---------------------------------------------------------------------------
let DATA = window.HB_RIVALS || { teams: [], rivals: [] };
let TEAMS = {};
const STORE = "hb_silhouette_v1";
let state = { seed: "hashiriya-v1", overrides: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

// ---------------------------------------------------------------------------
// Zufall aus der ID (immer gleich für dieselbe ID)
// ---------------------------------------------------------------------------
function fnv(s) { let h = 0x811c9dc5; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function pick(list, r) {
  const tot = list.reduce((s, p) => s + (p.w ?? 1), 0);
  let x = r() * tot;
  for (const p of list) { x -= (p.w ?? 1); if (x < 0) return p.id; }
  return list[list.length - 1].id;
}

// ---------------------------------------------------------------------------
// Geometrie
// ---------------------------------------------------------------------------
const CX = 150, CY = 122;
const f = n => Math.round(n * 10) / 10;
// Superellipse: p=2 rund, größer = kantiger. Oben und unten getrennt (Kinnform).
function pt(h, t, o = 0) {
  const c = Math.cos(t), s = Math.sin(t);
  const p = s < 0 ? h.pT : h.pB, ry = s < 0 ? h.ryT : h.ryB;
  return [CX + (h.rx + o) * Math.sign(c) * Math.pow(Math.abs(c), 2 / p), CY + (ry + o) * Math.sign(s) * Math.pow(Math.abs(s), 2 / p)];
}
function arc(h, t1, t2, o = 0, n = 28) {
  const out = [];
  for (let i = 0; i <= n; i++) out.push(pt(h, t1 + (t2 - t1) * i / n, o));
  return out;
}
const P = ([x, y]) => `${f(x)},${f(y)}`;
const poly = pts => pts.map((p, i) => (i ? "L" : "M") + P(p)).join(" ");
const line = pts => pts.map(P).join(" L");
const PI = Math.PI;

function torso(sw, top = 186) {
  return `M${CX - 16},${top} C${CX - 34},${top + 6} ${CX - sw + 24},${top + 10} ${CX - sw},${top + 26} C${CX - sw - 16},${top + 36} ${CX - sw - 20},${top + 70} ${CX - sw - 22},300 L${CX + sw + 22},300 C${CX + sw + 20},${top + 70} ${CX + sw + 16},${top + 36} ${CX + sw},${top + 26} C${CX + sw - 24},${top + 10} ${CX + 34},${top + 6} ${CX + 16},${top} Z`;
}
const mirror = d => d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (m, x, y) => `${f(2 * CX - +x)},${y}`);

// kleine Zeichenhelfer, c = Zeichenkontext
const seam = (c, d, w = 1.6) => `<path d="${d}" fill="none" stroke="${c.S}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const rim = (c, op = .85, w = 2.2) => `stroke="${c.A}" stroke-opacity="${op}" stroke-width="${w}" stroke-linejoin="round"`;
const accLine = (c, d, w = 3, op = 1) => `<path d="${d}" fill="none" stroke="${c.A}" stroke-opacity="${op}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const bodyFill = c => `url(#${c.u}-body)`;
const base = (c, sw) => `<path d="${torso(sw)}" fill="${bodyFill(c)}" ${rim(c)}/>`;

// ---------------------------------------------------------------------------
// Teile-Kit
// ---------------------------------------------------------------------------
const HEADS = [
  { id: "rund",   de: "Rund",          rx: 37, ryT: 43, ryB: 43, pT: 2.2, pB: 2.2 },
  { id: "oval",   de: "Oval",          rx: 32, ryT: 47, ryB: 47, pT: 2,   pB: 2 },
  { id: "kantig", de: "Kantig",        rx: 36, ryT: 45, ryB: 45, pT: 3.6, pB: 3.6 },
  { id: "breit",  de: "Breit",         rx: 42, ryT: 40, ryB: 42, pT: 2.4, pB: 3 },
  { id: "schmal", de: "Schmal kantig", rx: 31, ryT: 46, ryB: 48, pT: 3,   pB: 2.6 },
  { id: "kinn",   de: "Spitzes Kinn",  rx: 36, ryT: 42, ryB: 50, pT: 2.2, pB: 1.6 },
];
const H = id => HEADS.find(h => h.id === id) || HEADS[0];

const FACES = [
  { id: "visier", de: "Visier", w: 3, draw(c, h) {
      const x1 = CX - h.rx * .78, x2 = CX + h.rx * .78;
      return `<rect x="${f(x1)}" y="${CY - 11}" width="${f(x2 - x1)}" height="15" rx="7.5" fill="#07080b"/>
        <path d="M${f(x1 + 6)},${CY - 3.5} H${f(x2 - 6)}" stroke="${c.A}" stroke-width="1.8" stroke-linecap="round" filter="url(#${c.u}-glow)"/>`; } },
  { id: "leds", de: "Zwei Lichter", w: 2, draw(c, h) {
      const dx = h.rx * .38;
      return `<circle cx="${f(CX - dx)}" cy="${CY - 3}" r="3.6" fill="${c.A}" filter="url(#${c.u}-glow)"/><circle cx="${f(CX + dx)}" cy="${CY - 3}" r="3.6" fill="${c.A}" filter="url(#${c.u}-glow)"/>`; } },
  { id: "schlitz", de: "Lichtschlitz", w: 2, draw(c, h) {
      return `<path d="M${f(CX - h.rx * .5)},${CY - 3} H${f(CX + h.rx * .5)}" stroke="${c.A}" stroke-width="2.4" stroke-linecap="round" filter="url(#${c.u}-glow)"/>`; } },
  { id: "linse", de: "Linse", w: 1, draw(c, h) {
      return `<circle cx="${CX}" cy="${CY - 3}" r="9" fill="#07080b" stroke="${c.S}" stroke-width="1.5"/><circle cx="${CX}" cy="${CY - 3}" r="3.8" fill="${c.A}" filter="url(#${c.u}-glow)"/>`; } },
  { id: "leer", de: "Ohne Gesicht", w: 1, draw(c, h) {
      return seam(c, `M${f(CX - h.rx * .55)},${CY - 4} Q${CX},${CY - 1} ${f(CX + h.rx * .55)},${CY - 4}`, 1.2); } },
];

const HAIRCOLORS = [
  { id: "schwarz", de: "Schwarz",   w: 5, c: "#0b0d11" },
  { id: "braun",   de: "Dunkelbraun", w: 2, c: "#241812" },
  { id: "blond",   de: "Blondiert", w: 1.5, c: "#8a7140" },
  { id: "silber",  de: "Silbergrau", w: 1, c: "#7d838e" },
  { id: "crew",    de: "Crewfarbe", w: .8, c: null },
];

// Haar-/Kopfbedeckungs-Formen. back = hinter Kopf, front = vor Kopf.
function capFront(h, hl, dip, o = 3, side = .12) {
  const a = arc(h, PI - side, 2 * PI + side, o);
  const rt = pt(h, 2 * PI - .25, -1), lt = pt(h, PI + .25, -1);
  return `${poly(a)} L${P(rt)} Q${f(CX + h.rx * .55)},${f(hl - 2)} ${CX},${f(hl + dip)} Q${f(CX - h.rx * .55)},${f(hl - 2)} ${P(lt)} Z`;
}
const hairStyle = (c, d) => `<path d="${d}" fill="${c.Hc}" stroke="${c.A}" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/>`;
const HAIRS = [
  { id: "kahl", de: "Glatze", w: 1, front(c, h) {
      return seam(c, `M${P(pt(h, PI + .5))} Q${CX},${f(CY - h.ryT * 1.05)} ${P(pt(h, 2 * PI - .5))}`, 1.3); } },
  { id: "kurz", de: "Kurz", w: 2, front(c, h) { return hairStyle(c, capFront(h, CY - h.ryT * .5, 3)); } },
  { id: "scheitel", de: "Seitenscheitel", w: 1.5, front(c, h) {
      const hl = CY - h.ryT * .48;
      const a = arc(h, PI - .1, 2 * PI + .1, 3);
      const d = `${poly(a)} L${P(pt(h, 2 * PI - .25, -1))} Q${f(CX + h.rx * .6)},${f(hl - 8)} ${f(CX + h.rx * .2)},${f(hl - 6)} Q${f(CX - h.rx * .3)},${f(hl + 6)} ${P(pt(h, PI + .2, -1))} Z`;
      return hairStyle(c, d) + seam(c, `M${f(CX + h.rx * .32)},${f(CY - h.ryT - 1)} Q${f(CX + h.rx * .28)},${f(hl - 10)} ${f(CX + h.rx * .2)},${f(hl - 6)}`, 1.2); } },
  { id: "stachel", de: "Stachelig", w: 1.5, front(c, h) {
      const r = rng(fnv(c.id + "spk"));
      let pts = [pt(h, PI - .1, 3)];
      const n = 9;
      for (let i = 0; i < n; i++) {
        const t = PI + .2 + (PI - .4) * (i + .5) / n;
        pts.push(pt(h, t - .13, 2), pt(h, t, 13 + r() * 7), pt(h, t + .13, 2));
      }
      pts.push(pt(h, 2 * PI + .1, 3));
      const hl = CY - h.ryT * .5;
      const fr = [];
      for (let i = 0; i <= 6; i++) { const x = CX + h.rx * .75 - i * h.rx * .25; fr.push([x, hl + (i % 2 ? 7 : -1)]); }
      return hairStyle(c, `${poly(pts)} L${P(pt(h, 2 * PI - .25, -1))} L${line(fr)} L${P(pt(h, PI + .25, -1))} Z`); } },
  { id: "tolle", de: "Tolle", w: 1.2, front(c, h) {
      const top = CY - h.ryT;
      return hairStyle(c, capFront(h, CY - h.ryT * .58, -2)) +
        hairStyle(c, `M${f(CX - h.rx * .75)},${f(top + 10)} C${f(CX - h.rx * .8)},${f(top - 18)} ${f(CX + h.rx * .9)},${f(top - 26)} ${f(CX + h.rx * 1.05)},${f(top - 6)} C${f(CX + h.rx * .7)},${f(top + 2)} ${f(CX + h.rx * .2)},${f(top + 6)} ${f(CX - h.rx * .75)},${f(top + 10)} Z`); } },
  { id: "lang", de: "Lang", w: 1.2,
    back(c, h) {
      const a = arc(h, PI - .05, 2 * PI + .05, 5);
      const yb = CY + h.ryB + 34;
      return `<path d="${poly(a)} C${f(CX + h.rx + 10)},${f(CY + 30)} ${f(CX + h.rx + 14)},${f(yb - 10)} ${f(CX + h.rx + 12)},${f(yb)} L${f(CX - h.rx - 12)},${f(yb)} C${f(CX - h.rx - 14)},${f(yb - 10)} ${f(CX - h.rx - 10)},${f(CY + 30)} ${P(a[0])} Z" fill="${c.Hc}" stroke="${c.A}" stroke-opacity=".55" stroke-width="1.6"/>`; },
    front(c, h) {
      const A = pt(h, PI - .5, 3), B = pt(h, 2 * PI + .5, 3);
      const a = arc(h, PI - .5, 2 * PI + .5, 3);
      const C = pt(h, 2 * PI + .5, -7), G = pt(h, PI - .5, -7);
      return hairStyle(c, `${poly(a)} L${P(C)} Q${f(CX + h.rx * .9)},${f(CY - h.ryT * .2)} ${f(CX + h.rx * .5)},${f(CY - h.ryT * .5)} Q${f(CX + h.rx * .15)},${f(CY - h.ryT * .65)} ${CX},${f(CY - h.ryT * .85)} Q${f(CX - h.rx * .15)},${f(CY - h.ryT * .65)} ${f(CX - h.rx * .5)},${f(CY - h.ryT * .5)} Q${f(CX - h.rx * .9)},${f(CY - h.ryT * .2)} ${P(G)} Z`); } },
  { id: "zopf", de: "Zopf", w: 1,
    back(c, h) {
      const x = CX + h.rx, y = CY - h.ryT * .35;
      return `<path d="M${f(x - 6)},${f(y - 6)} C${f(x + 16)},${f(y - 10)} ${f(x + 22)},${f(y + 30)} ${f(x + 14)},${f(y + 66)} C${f(x + 8)},${f(y + 40)} ${f(x + 2)},${f(y + 20)} ${f(x - 6)},${f(y + 10)} Z" fill="${c.Hc}" stroke="${c.A}" stroke-opacity=".55" stroke-width="1.6"/>`; },
    front(c, h) {
      const x = CX + h.rx, y = CY - h.ryT * .35;
      return hairStyle(c, capFront(h, CY - h.ryT * .55, 2)) + `<rect x="${f(x + 1)}" y="${f(y - 4)}" width="8" height="6" rx="2" fill="${c.A}" transform="rotate(20 ${f(x + 5)} ${f(y)})"/>`; } },
  { id: "dutt", de: "Dutt", w: .8, front(c, h) {
      const top = CY - h.ryT;
      return hairStyle(c, `M${CX - 13},${f(top + 2)} a13,12 0 1 1 26,0 a13,12 0 1 1 -26,0 Z`) + hairStyle(c, capFront(h, CY - h.ryT * .55, 1)) +
        `<path d="M${CX - 11},${f(top + 1)} H${CX + 11}" stroke="${c.A}" stroke-width="3" stroke-linecap="round"/>`; } },

  { id: "handtuch", de: "Handtuch im Nacken", layer: "neck", w: .7, draw(c, h) {
      const y = CY + h.ryB;
      return `<path d="M${CX - 22},${f(y)} Q${CX - 30},${f(y + 10)} ${CX - 34},${f(y + 60)} L${CX - 20},${f(y + 62)} Q${CX - 18},${f(y + 24)} ${CX - 12},${f(y + 12)} Q${CX},${f(y + 18)} ${CX + 12},${f(y + 12)} Q${CX + 18},${f(y + 24)} ${CX + 20},${f(y + 62)} L${CX + 34},${f(y + 60)} Q${CX + 30},${f(y + 10)} ${CX + 22},${f(y)} Q${CX},${f(y + 8)} ${CX - 22},${f(y)} Z" fill="#d8dbe2" fill-opacity=".92"/>
        <path d="M${CX - 33},${f(y + 52)} L${CX - 20},${f(y + 54)} M${CX + 20},${f(y + 54)} L${CX + 33},${f(y + 52)}" stroke="${c.A}" stroke-width="3"/>`; } },
  { id: "kratzer", de: "Kratzer am Kopf", layer: "face", w: .6, draw(c, h) {
      return `<path d="M${f(CX + h.rx * .35)},${f(CY - h.ryT * .35)} l10,14 M${f(CX + h.rx * .5)},${f(CY - h.ryT * .32)} l7,10 M${f(CX - h.rx * .55)},${f(CY + h.ryB * .25)} l9,-3" stroke="#c9ced6" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>`; } },
];

const TONES = [
  { id: "graphit", de: "Graphit", w: 3, c: ["#363c48", "#14171d"] },
  { id: "nachtblau", de: "Nachtblau", w: 2, c: ["#2b3756", "#111625"] },
  { id: "braun", de: "Braun", w: 1, c: ["#43342e", "#1a1412"] },
  { id: "oliv", de: "Oliv", w: 1, c: ["#343c2e", "#13170f"] },
  { id: "hell", de: "Hellgrau", w: 1, c: ["#5a606c", "#262a32"] },
  { id: "weinrot", de: "Weinrot", w: .8, c: ["#45252b", "#1a0e11"] },
];

const SLOTS = [
  { key: "kopf", de: "Kopf", list: HEADS },
  { key: "gesicht", de: "Gesicht", list: FACES },
  { key: "haare", de: "Haare / Hut", list: HAIRS },
  { key: "haarfarbe", de: "Haarfarbe", list: HAIRCOLORS },
  { key: "brille", de: "Brille", list: GLASSES },
  { key: "jacke", de: "Jacke", list: JACKETS },
  { key: "ton", de: "Stoff-Farbton", list: TONES },
  { key: "extra", de: "Extra", list: EXTRAS },
];
const byId = (list, id) => list.find(p => p.id === id) || list[0];

// ---------------------------------------------------------------------------
// Automatische Teile je Gegner (eindeutig über alle Gegner)
// ---------------------------------------------------------------------------
const WANDER_COLORS = ["#e0e3ea", "#c9a86a", "#9fb8d6", "#c79bd6", "#8fd6b8", "#e8a07a"];
const BOSS_COLORS = { b_shirotora: "#f2f4f8", b_kokuryu: "#7b5cff", b_mugen: "#ffcc33" };
function accentOf(r) {
  if (r.boss) return BOSS_COLORS[r.id] || "#ff3b3b";
  if (r.team && TEAMS[r.team]) return TEAMS[r.team].color;
  return WANDER_COLORS[fnv(state.seed + r.id) % WANDER_COLORS.length];
}
function autoParts(r, salt) {
  const R = rng(fnv(state.seed + "|" + r.id + "|" + salt));
  const out = {};
  for (const s of SLOTS) out[s.key] = pick(s.list, R);
  // Crew-Look: die meisten Mitglieder tragen die Crew-Jacke, der Leader immer
  if (r.team) {
    const uni = pick(JACKETS, rng(fnv(state.seed + "|crew|" + r.team)));
    if (r.leader || R() < .65) out.jacke = uni;
  }
  return out;
}
const sigOf = p => SLOTS.map(s => p[s.key]).join("|");
let AUTO = {};
function computeAuto() {
  AUTO = {};
  const used = new Set();
  const ids = DATA.rivals.map(r => r.id).sort();
  const rmap = Object.fromEntries(DATA.rivals.map(r => [r.id, r]));
  for (const id of ids) {
    let salt = 0, p;
    do { p = autoParts(rmap[id], salt++); } while (used.has(sigOf(p)) && salt < 50);
    used.add(sigOf(p));
    AUTO[id] = p;
  }
}
function partsOf(r) { return Object.assign({}, AUTO[r.id], r.silhouette || {}, state.overrides[r.id] || {}); }

// ---------------------------------------------------------------------------
// SVG zeichnen
// ---------------------------------------------------------------------------
let uidN = 0;
function renderSvg(r, parts, opts = {}) {
  const u = "s" + (uidN++);
  const A = accentOf(r);
  const h = H(parts.kopf);
  const tone = byId(TONES, parts.ton).c;
  const hcol = byId(HAIRCOLORS, parts.haarfarbe).c || A;
  const c = { u, A, S: "#4d5566", Hc: hcol, id: r.id };
  const hair = byId(HAIRS, parts.haare);
  const jacket = byId(JACKETS, parts.jacke).draw(c);
  const extra = byId(EXTRAS, parts.extra);
  const face = byId(FACES, parts.gesicht);
  const glasses = byId(GLASSES, parts.brille);
  const team = r.team && TEAMS[r.team];
  const jp = r.boss ? "首領" : team ? (team.jp || "") : "放浪者";
  const neckTop = CY + h.ryB - 10;
  const bg = opts.bg === false ? "" : `
    <rect width="300" height="300" fill="#0e1015"/>
    <rect width="300" height="300" fill="url(#${u}-bg)"/>
    <rect width="300" height="300" fill="url(#${u}-st)"/>
    <g fill="${A}" fill-opacity=".16" font-size="28" font-weight="700" font-family="'Yu Gothic','Meiryo','Noto Sans JP',sans-serif" text-anchor="middle">${[...jp].map((ch, i) => `<text x="274" y="${36 + i * 31}">${esc(ch)}</text>`).join("")}</g>
    <rect y="296" width="300" height="4" fill="${A}"/>`;
  let badge = "";
  if (r.leader || r.boss) badge = `<path d="M${CX + 30},220 l9,-6 l9,6 v8 l-9,-6 l-9,6 z" fill="${A}"/><path d="M${CX + 30},232 l9,-6 l9,6 v6 l-9,-6 l-9,6 z" fill="${A}" fill-opacity=".6"/>`;
  const ears = `<circle cx="${f(CX - h.rx)}" cy="${CY + 2}" r="7.5" fill="url(#${u}-head)" stroke="${c.S}" stroke-width="1.4"/><circle cx="${f(CX + h.rx)}" cy="${CY + 2}" r="7.5" fill="url(#${u}-head)" stroke="${c.S}" stroke-width="1.4"/>
    <circle cx="${f(CX - h.rx)}" cy="${CY + 2}" r="2.6" fill="${c.S}"/><circle cx="${f(CX + h.rx)}" cy="${CY + 2}" r="2.6" fill="${c.S}"/>`;
  const head = `<path d="${poly(arc(h, 0, 2 * PI, 0, 72))} Z" fill="url(#${u}-head)" ${rim(c, .9, 2.2)}/>` +
    seam(c, `M${P(pt(h, .5, -3))} Q${CX},${f(CY + h.ryB * .78)} ${P(pt(h, PI - .5, -3))}`, 1.2);
  const neck = `<rect x="${CX - 13}" y="${f(neckTop)}" width="26" height="${f(196 - neckTop)}" rx="5" fill="url(#${u}-head)" stroke="${c.S}" stroke-width="1.4"/>` +
    seam(c, `M${CX - 12},${f(neckTop + 12)} H${CX + 12} M${CX - 12},${f(neckTop + 20)} H${CX + 12}`, 1.2);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="${u}-head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b5261"/><stop offset="1" stop-color="#1a1e26"/></linearGradient>
    <linearGradient id="${u}-body" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="${tone[0]}"/><stop offset="1" stop-color="${tone[1]}"/></linearGradient>
    <radialGradient id="${u}-bg" cx=".2" cy="1" r="1"><stop offset="0" stop-color="${A}" stop-opacity=".36"/><stop offset=".55" stop-color="${A}" stop-opacity=".05"/><stop offset="1" stop-color="${A}" stop-opacity="0"/></radialGradient>
    <pattern id="${u}-st" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="4" height="10" fill="#fff" fill-opacity=".03"/></pattern>
    <filter id="${u}-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  ${bg}
  <g transform="translate(-18 -36) scale(1.12)">
  ${hair.back ? hair.back(c, h) : ""}
  ${jacket.back || ""}
  ${neck}
  ${jacket.body}
  ${badge}
  ${jacket.front || ""}
  ${extra.layer === "neck" ? extra.draw(c, h) : ""}
  ${ears}
  ${head}
  ${face.draw(c, h)}
  ${hair.front(c, h)}
  ${glasses.draw(c, h)}
  ${extra.layer === "face" ? extra.draw(c, h) : ""}
  </g>
</svg>`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

// ---------------------------------------------------------------------------
// Oberfläche
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
let cur = null, filtered = [], dupSet = new Set();

function tx(o) { if (!o) return ""; if (typeof o === "string") return o; return o[$("lang").value] || o.de || o.en || ""; }
function teamName(r) { return r.boss ? "Boss" : r.team && TEAMS[r.team] ? TEAMS[r.team].name : "Wanderer"; }

function computeDups() {
  const cnt = {};
  for (const r of DATA.rivals) { const s = sigOf(partsOf(r)); (cnt[s] = cnt[s] || []).push(r.id); }
  dupSet = new Set(Object.values(cnt).filter(a => a.length > 1).flat());
}
function updateStat() {
  const n = DATA.rivals.length, ov = Object.keys(state.overrides).filter(k => Object.keys(state.overrides[k]).length).length;
  $("stat").innerHTML = `${n} Gegner · ${ov} geändert · ${dupSet.size ? `<b class="bad">${dupSet.size} doppelt</b>` : `<b class="ok">alle einzigartig</b>`}`;
}
function applyFilter() {
  const q = $("search").value.trim().toLowerCase(), cf = $("crewFilter").value;
  filtered = DATA.rivals.filter(r => {
    if (cf === "_w" && (r.team || r.boss)) return false;
    if (cf === "_b" && !r.boss) return false;
    if (cf === "_l" && !r.leader) return false;
    if (cf && cf[0] !== "_" && r.team !== cf) return false;
    if ($("onlyOv").checked && !Object.keys(state.overrides[r.id] || {}).length) return false;
    if ($("onlyDup").checked && !dupSet.has(r.id)) return false;
    if (q && !(r.id + " " + r.name + " " + tx(r.nick) + " " + (r.nick?.de || "") + " " + (r.nick?.en || "")).toLowerCase().includes(q)) return false;
    return true;
  });
}
function renderList() {
  $("list").innerHTML = filtered.map(r => {
    const fl = r.boss ? "BOSS" : r.leader ? "LEADER" : r.team ? "" : "WANDERER";
    const ov = Object.keys(state.overrides[r.id] || {}).length ? `<span class="ov">●</span>` : "";
    const du = dupSet.has(r.id) ? `<span class="du">doppelt</span>` : "";
    return `<div class="it${cur && cur.id === r.id ? " sel" : ""}" data-id="${esc(r.id)}"><span class="dot" style="background:${accentOf(r)}"></span><span class="nm">${esc(r.name)}</span>${ov}${du}<span class="fl">${fl}</span></div>`;
  }).join("");
}
function renderGrid() {
  $("gridInfo").textContent = `${filtered.length} angezeigt · Klick zum Bearbeiten`;
  $("grid").innerHTML = filtered.map(r => `<div class="c${cur && cur.id === r.id ? " sel" : ""}${dupSet.has(r.id) ? " dup" : ""}" data-id="${esc(r.id)}" title="${esc(r.id)}">${renderSvg(r, partsOf(r))}<div class="n">${esc(r.name)}</div></div>`).join("");
}
function renderCurrent() {
  if (!cur) return;
  const r = cur, p = partsOf(r), A = accentOf(r);
  $("bubble").style.setProperty("--crew", A);
  $("por").innerHTML = renderSvg(r, p, { bg: $("showBg").checked }) + (r.boss ? `<span class="badge">BOSS</span>` : r.leader ? `<span class="badge">LEADER</span>` : !r.team ? `<span class="badge">WANDERER</span>` : "");
  $("big").innerHTML = renderSvg(r, p, { bg: $("showBg").checked });
  $("bCrew").textContent = teamName(r);
  $("bName").textContent = r.name;
  $("bNick").textContent = tx(r.nick);
  $("bLine").textContent = "„" + tx(r.lines && r.lines[$("lineType").value]) + "“";
  $("pTitle").textContent = `Teile für ${r.name} (${r.id})`;
  const ov = state.overrides[r.id] || {};
  $("rows").innerHTML = SLOTS.map(s => {
    const auto = byId(s.list, AUTO[r.id][s.key]).de;
    const opts = [`<option value="">Auto (${esc(auto)})</option>`].concat(s.list.map(it => `<option value="${it.id}"${ov[s.key] === it.id ? " selected" : ""}>${esc(it.de)}</option>`)).join("");
    return `<div class="row${ov[s.key] ? " ov" : ""}"><span class="lbl">${s.de}</span><select data-slot="${s.key}">${opts}</select><button data-cycle="${s.key}" title="Nächste Variante">↻</button></div>`;
  }).join("");
  const dup = dupSet.has(r.id);
  $("sig").className = "sig" + (dup ? " bad" : "");
  $("sig").textContent = dup ? "Achtung: genau diese Kombination hat noch ein anderer Gegner." : "Kombination: " + sigOf(p);
}
function selectRival(id) {
  cur = DATA.rivals.find(r => r.id === id) || DATA.rivals[0];
  renderCurrent();
  document.querySelectorAll("#list .it, #grid .c").forEach(el => el.classList.toggle("sel", el.dataset.id === cur.id));
}
function refreshAll(keepScroll) {
  computeDups(); updateStat(); applyFilter(); renderList(); renderGrid(); renderCurrent();
}
function setOverride(slot, val) {
  const ov = state.overrides[cur.id] = state.overrides[cur.id] || {};
  if (val) ov[slot] = val; else delete ov[slot];
  if (!Object.keys(ov).length) delete state.overrides[cur.id];
  save();
  computeDups(); updateStat(); renderCurrent();
  // nur die betroffenen Einträge neu zeichnen
  const card = document.querySelector(`#grid .c[data-id="${CSS.escape(cur.id)}"]`);
  if (card) card.innerHTML = renderSvg(cur, partsOf(cur)) + `<div class="n">${esc(cur.name)}</div>`;
  document.querySelectorAll("#grid .c").forEach(el => el.classList.toggle("dup", dupSet.has(el.dataset.id)));
  renderList();
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }

function initTeams() {
  TEAMS = Object.fromEntries(DATA.teams.map(t => [t.id, t]));
  $("crewFilter").innerHTML = `<option value="">Alle Crews</option><option value="_l">Nur Leader</option><option value="_w">Wanderer</option><option value="_b">Bosse</option>` +
    DATA.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
}

// PNG
function svgToPng(svg, size) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = cv.height = size;
      cv.getContext("2d").drawImage(img, 0, 0, size, size);
      cv.toBlob(b => b ? res(b) : rej(new Error("toBlob")), "image/png");
    };
    img.onerror = rej;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace(/width="300" height="300"/, `width="${size}" height="${size}"`));
  });
}
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

// Events
$("list").addEventListener("click", e => { const it = e.target.closest(".it"); if (it) selectRival(it.dataset.id); });
$("grid").addEventListener("click", e => { const it = e.target.closest(".c"); if (it) { selectRival(it.dataset.id); window.scrollTo({ top: 0, behavior: "smooth" }); } });
$("rows").addEventListener("change", e => { if (e.target.dataset.slot) setOverride(e.target.dataset.slot, e.target.value); });
$("rows").addEventListener("click", e => {
  const k = e.target.dataset.cycle; if (!k) return;
  const s = SLOTS.find(s => s.key === k), now = partsOf(cur)[k];
  const i = s.list.findIndex(it => it.id === now);
  setOverride(k, s.list[(i + 1) % s.list.length].id);
});
["search", "crewFilter", "onlyOv", "onlyDup"].forEach(id => $(id).addEventListener("input", () => { applyFilter(); renderList(); renderGrid(); }));
["lineType", "lang", "showBg"].forEach(id => $(id).addEventListener("input", renderCurrent));
$("btnReset").onclick = () => { delete state.overrides[cur.id]; save(); refreshAll(); toast("Zurück auf Auto"); };
$("btnRandom").onclick = () => {
  const R = rng((Math.random() * 2 ** 32) >>> 0), ov = {};
  for (const s of SLOTS) ov[s.key] = pick(s.list, R);
  state.overrides[cur.id] = ov; save(); refreshAll();
};
function step(d) {
  const list = filtered.length ? filtered : DATA.rivals;
  const i = list.findIndex(r => r.id === cur.id);
  selectRival(list[(i + d + list.length) % list.length].id);
}
$("btnPrev").onclick = () => step(-1);
$("btnNext").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1);
});
$("btnPng").onclick = async () => {
  const size = +$("pngSize").value;
  download(await svgToPng(renderSvg(cur, partsOf(cur), { bg: $("showBg").checked }), size), `${cur.id}.png`);
};
$("btnPngAll").onclick = async () => {
  try { if (!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"); }
  catch (e) { toast("JSZip konnte nicht geladen werden (kein Internet?)"); return; }
  const size = +$("pngSize").value, zip = new JSZip();
  let n = 0;
  for (const r of filtered) {
    zip.file(`${r.id}.png`, await svgToPng(renderSvg(r, partsOf(r), { bg: $("showBg").checked }), size));
    if (++n % 20 === 0) toast(`${n} / ${filtered.length} …`);
  }
  download(await zip.generateAsync({ type: "blob" }), `hashiriya_silhouetten_${size}.zip`);
  toast(`${n} Bilder gepackt`);
};
$("seed").value = state.seed;
$("seed").addEventListener("change", () => { state.seed = $("seed").value.trim() || "hashiriya-v1"; save(); computeAuto(); refreshAll(); toast("Alle Auto-Silhouetten neu berechnet"); });
$("btnExportJson").onclick = () => {
  const out = { _hinweis: "Hashiriya Battle Silhouetten: seed + eigene Änderungen je Gegner-ID. Wieder einlesen mit 'Importieren'.", seed: state.seed, overrides: state.overrides };
  download(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }), "silhouetten.json");
};
$("btnImportJson").onclick = () => $("fileJson").click();
$("fileJson").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    state.seed = j.seed || state.seed; state.overrides = j.overrides || {};
    $("seed").value = state.seed; save(); computeAuto(); refreshAll(); toast("Importiert");
  } catch (err) { toast("Datei konnte nicht gelesen werden"); }
  e.target.value = "";
};
$("btnLoadRivals").onclick = () => $("fileRivals").click();
$("fileRivals").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (!Array.isArray(j.rivals) || !Array.isArray(j.teams)) throw new Error("kein rivals.json");
    DATA = { teams: j.teams, rivals: j.rivals };
    initTeams(); computeAuto(); cur = DATA.rivals[0]; refreshAll(); toast(`${DATA.rivals.length} Gegner geladen`);
  } catch (err) { toast("Das ist keine gültige rivals.json"); }
  e.target.value = "";
};

// Start
initTeams();
computeAuto();
cur = DATA.rivals[0];
refreshAll();
</script>
</body>
</html>

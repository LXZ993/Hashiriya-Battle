<style>
:root{--bg:#0b0d12;--panel:#141821;--panel2:#1a1f2a;--line:#272e3b;--txt:#e8eaf0;--dim:#8e97aa;--acc:#ff7a1a;--acc2:#ffb066;--ok:#5fd38d;--bad:#ff6b6b;--warn:#ffcf5a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--acc2)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(13,15,20,.96);backdrop-filter:blur(6px)}
.logo{width:38px;height:38px;border-radius:9px;background:var(--acc);color:#111;display:grid;place-items:center;font-size:24px;font-weight:900;flex:none}
header h1{font-size:17px;margin:0;line-height:1.15}
header h1 small{display:block;color:var(--dim);font-weight:400;font-size:12px;letter-spacing:.5px}
.sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--txt)}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
button.primary:hover{background:#ff8e3d}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:6px 10px;background:transparent;color:var(--dim)}
.lang button.on{background:var(--panel2);color:var(--txt);font-weight:700}
main{max-width:1240px;margin:0 auto;padding:22px 18px 80px;display:grid;grid-template-columns:380px 1fr;gap:26px;align-items:start}
#card{position:sticky;top:78px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
#big{width:100%;aspect-ratio:1;border-radius:12px;display:block;background:#07080b}
#cname{font-size:22px;font-weight:800;margin:12px 0 0;line-height:1.2;word-break:break-word}
#cjp{color:var(--dim);font-size:14px;margin-left:6px;font-weight:400}
#cnick{color:var(--acc2);font-size:14px;min-height:20px}
.cardrow{display:flex;gap:14px;align-items:center;margin-top:14px}
#seal{width:112px;height:112px;flex:none}
#plate{flex:1;min-width:0}
.cardbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cardbtns button{flex:1}
section.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
section.step h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px}
section.step h2 .n{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#111;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
section.step h2 .st{margin-left:auto;font-size:12px;font-weight:600;color:var(--dim)}
section.step h2 .st.ok{color:var(--ok)}
.lead{color:var(--dim);margin:0 0 14px}
.intro{background:linear-gradient(135deg,#2a1708,#141821 60%);border-color:#4a2a10}
.intro p{margin:0 0 10px}
.intro b{color:var(--acc2)}
.f{margin:14px 0 0}
.f>label,.f>.lab{display:block;font-weight:600;margin-bottom:5px}
.f .req{color:var(--acc)}
.f .hint{color:var(--dim);font-size:13px;margin-top:4px}
.f .err{color:var(--bad);font-size:13px;margin-top:4px;display:none}
.f.bad .err{display:block}
.f.bad input,.f.bad textarea,.f.bad select{border-color:var(--bad)}
input[type=text],input[type=number],textarea,select{width:100%;background:#0f1218;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .f{margin-top:0}
.cnt{float:right;color:var(--dim);font-weight:400;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;background:#0f1218;border:1px solid var(--line);font-size:13.5px;line-height:1.3}
.chip.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700}
.chip:disabled{opacity:.33;cursor:not-allowed;border-style:dashed}
.chip.lock{opacity:.42;border-style:dashed;cursor:help}
.lockwhy{grid-column:2;color:var(--dim);font-size:12.5px;margin-top:-4px;line-height:1.45}
.desc{color:var(--acc2);font-size:13.5px;margin-top:6px;min-height:18px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid #0b0d12;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--acc);transform:scale(1.08)}
.sw.none{background:repeating-linear-gradient(45deg,#2a303c 0 4px,#151922 4px 8px)}
.av{display:grid;grid-template-columns:150px 1fr;gap:10px 14px;align-items:start;margin-top:10px}
.av>.k{color:var(--dim);font-size:13.5px;padding-top:5px}
.av h3{grid-column:1/-1;margin:14px 0 0;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:4px}
#avnote{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--dim)}
.drop.over{border-color:var(--acc);background:#1d150e}
.drop b{color:var(--txt)}
#pcinfo{margin-top:10px;font-size:14px}
#pcinfo .ok{color:var(--ok)}#pcinfo .bad{color:var(--bad)}
.paints{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.paints i{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid #0008}
details{margin-top:10px}
details summary{cursor:pointer;color:var(--dim)}
.cond{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#10141b}
.cgh{margin:18px 0 4px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.cond>label{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.cond .sub{display:none;margin:10px 0 2px 28px}
.cond.on .sub{display:block}
.cond.on{border-color:#5a3a1c}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.rangeval{font-weight:700;color:var(--acc2)}
.bubble{position:relative;background:#f3f1ea;color:#16181d;border-radius:14px;padding:10px 14px;margin-top:8px;font-weight:600;min-height:20px}
.bubble:empty{display:none}
#todo{margin:0;padding-left:20px;color:var(--bad)}
#todo li{margin:2px 0}
#done{color:var(--ok);font-weight:600;display:none}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.final{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.final button{padding:11px 18px;font-size:16px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);padding:10px 16px;border-radius:10px;display:none;z-index:50;max-width:90vw}
footer{grid-column:1/-1;color:var(--dim);font-size:12px;text-align:center}
main>*,#steps>*{min-width:0}
code{word-break:break-all}
@media (max-width:560px){header{padding:8px 12px;gap:8px}header h1 small{display:none}header h1{font-size:15px}#openBtn{padding:6px 8px;font-size:13px}main{padding:14px 12px 60px}section.step{padding:14px}}
@media (max-width:920px){main{grid-template-columns:minmax(0,1fr)}#card{position:static}.av{grid-template-columns:minmax(0,1fr)}.av>.k{padding-top:0}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">走</div>
  <h1>Hashiriya Battle<small data-t="sub"></small></h1>
  <span class="sp"></span>
  <div class="lang"><button data-l="en">EN</button><button data-l="de">DE</button></div>
  <button id="openBtn" data-t="open"></button>
  <input type="file" id="openFile" accept=".json,application/json" hidden>
</header>
<main>
  <aside id="card">
    <img id="big" alt="">
    <div id="cname"></div>
    <div id="cnick"></div>
    <div class="cardrow"><svg id="seal" viewBox="0 0 512 512"></svg><svg id="plate" viewBox="0 0 330 165"></svg></div>
    <div class="cardbtns">
      <button id="rnd" data-t="random"></button>
      <button id="png" data-t="png"></button>
    </div>
  </aside>

  <div id="steps">
    <section class="step intro">
      <h2 data-t="introH"></h2>
      <div data-th="introT"></div>
    </section>

    <section class="step" id="s1">
      <h2><span class="n">1</span><span data-t="s1"></span><span class="st"></span></h2>
      <div class="f" data-k="credit"><label><span data-t="credit"></span> <span class="req">*</span></label><input type="text" id="credit" maxlength="40"><div class="hint" data-t="creditH"></div><div class="err" data-t="needed"></div></div>
      <div class="f" data-k="contact"><label><span data-t="contact"></span> <span class="req">*</span></label><input type="text" id="contact" maxlength="80"><div class="hint" data-t="contactH"></div><div class="err" data-t="needed"></div></div>
      <div class="f"><div class="lab" data-t="role"></div><div class="chips" id="role"></div></div>
    </section>

    <section class="step" id="s2">
      <h2><span class="n">2</span><span data-t="s2"></span><span class="st"></span></h2>
      <p class="lead" data-t="s2L"></p>
      <div class="f" data-k="name"><label><span data-t="name"></span> <span class="req">*</span> <span class="cnt" id="nameC"></span></label><input type="text" id="name" maxlength="24"><div class="hint" data-t="nameH"></div><div class="err" id="nameE"></div></div>
      <div class="two" style="margin-top:14px">
        <div class="f"><label data-t="jp"></label><input type="text" id="jp" maxlength="12"><div class="hint" data-t="jpH"></div></div>
        <div class="f"><label data-t="nick"></label><input type="text" id="nick" maxlength="32"><div class="hint" data-t="nickH"></div></div>
      </div>
      <div class="f"><label data-t="desc"></label><textarea id="desc" maxlength="400"></textarea><div class="hint" data-t="descH"></div></div>
      <div class="f"><label data-t="sealL"></label><input type="text" id="sign" maxlength="3" style="max-width:140px"><div class="hint" data-t="sealH"></div></div>
    </section>

    <section class="step" id="s3">
      <h2><span class="n">3</span><span data-t="s3"></span><span class="st ok" data-t="always"></span></h2>
      <p class="lead" data-t="s3L"></p>
      <div class="av" id="avatar"></div>
      <div id="avnote"></div>
    </section>

    <section class="step" id="s4">
      <h2><span class="n">4</span><span data-t="s4"></span><span class="st"></span></h2>
      <p class="lead" data-th="s4L"></p>
      <div class="f"><div class="lab" data-t="source"></div><div class="chips" id="source"></div></div>
      <div class="f" data-k="pc">
        <div class="lab"><span data-t="pcL"></span> <span class="req">*</span></div>
        <div class="drop" id="drop"><span data-th="dropT"></span><br><button id="pcBtn" style="margin-top:10px" data-t="pcBtn"></button></div>
        <input type="file" id="pcFile" accept=".pc,.json,text/plain" hidden>
        <div class="hint" data-th="pcH"></div>
        <div id="pcinfo"></div>
        <details><summary data-t="pasteS"></summary><textarea id="pcText" style="min-height:120px;font-family:Consolas,monospace;font-size:12px" spellcheck="false"></textarea></details>
      </div>
      <div class="f" data-k="model"><label><span data-t="model"></span> <span class="req">*</span></label><input type="text" id="model" maxlength="40" style="max-width:260px"><div class="hint" data-t="modelH"></div><div class="err" data-t="modelE"></div></div>
      <div id="modbox">
        <div class="two" style="margin-top:14px">
          <div class="f" data-k="modName"><label><span data-t="modName"></span> <span class="req">*</span></label><input type="text" id="modName" maxlength="80"><div class="err" data-t="needed"></div></div>
          <div class="f"><label data-t="modLink"></label><input type="text" id="modLink" maxlength="200" placeholder="https://www.beamng.com/resources/…"></div>
        </div>
        <div class="hint" data-t="modH" style="margin-top:6px"></div>
      </div>
      <div class="f"><label data-t="skin"></label><input type="text" id="skin" maxlength="80"><div class="hint" data-t="skinH"></div></div>
      <h3 style="margin:22px 0 0;font-size:15px" data-t="plateH"></h3>
      <p class="lead" style="margin-top:2px" data-t="plateL"></p>
      <div class="two">
        <div class="f"><label data-t="region"></label><select id="region"></select></div>
        <div class="f"><label data-t="ptype"></label><select id="ptype"></select></div>
      </div>
      <div class="two" style="margin-top:14px">
        <div class="f" data-k="ptop"><label><span data-t="ptop"></span> <span class="req">*</span></label><input type="text" id="ptop" maxlength="3" placeholder="330"><div class="err" data-t="ptopE"></div></div>
        <div class="f" data-k="pmain"><label><span data-t="pmain"></span> <span class="req">*</span></label><input type="text" id="pmain" maxlength="5" placeholder="12-34"><div class="err" data-t="pmainE"></div></div>
      </div>
      <div class="hint" data-t="pmainH" style="margin-top:6px;color:var(--dim);font-size:13px"></div>
    </section>

    <section class="step" id="s5">
      <h2><span class="n">5</span><span data-t="s5"></span><span class="st ok" data-t="always"></span></h2>
      <div class="f"><div class="lab" data-t="aggr"></div><div class="chips" id="aggr"></div><div class="desc" id="aggrD"></div><div class="hint" data-t="aggrH"></div></div>
      <div class="f"><div class="lab" data-t="cruise"></div><div class="chips" id="cruise"></div><div class="desc" id="cruiseD"></div><div class="hint" data-t="cruiseH"></div></div>
      <div class="f"><div class="lab" data-t="tier"></div><div class="chips" id="tier"></div><div class="desc" id="tierD"></div><div class="hint" data-t="tierH"></div></div>
    </section>

    <section class="step" id="s6">
      <h2><span class="n">6</span><span data-t="s6"></span><span class="st ok" data-t="optional"></span></h2>
      <p class="lead"><span data-t="s6L"></span> <span style="color:var(--acc2)"><b id="condCount"></b> <span data-t="condsN"></span>.</span></p>
      <div id="conds"></div>
      <div class="f"><label data-t="idea"></label><textarea id="idea" maxlength="300"></textarea><div class="hint" data-t="ideaH"></div></div>
    </section>

    <section class="step" id="s7">
      <h2><span class="n">7</span><span data-t="s7"></span><span class="st ok" data-t="optional"></span></h2>
      <p class="lead" data-t="s7L"></p>
      <div class="f"><label><span data-t="lChallenge"></span> <span class="cnt" id="lChallengeC"></span></label><input type="text" id="lChallenge" maxlength="90"><div class="bubble" id="lChallengeB"></div></div>
      <div class="f"><label><span data-t="lWin"></span> <span class="cnt" id="lWinC"></span></label><input type="text" id="lWin" maxlength="90"><div class="bubble" id="lWinB"></div></div>
      <div class="f"><label><span data-t="lLose"></span> <span class="cnt" id="lLoseC"></span></label><input type="text" id="lLose" maxlength="90"><div class="bubble" id="lLoseB"></div></div>
    </section>

    <section class="step" id="s8">
      <h2><span class="n">8</span><span data-t="s8"></span></h2>
      <p class="lead" data-t="s8L"></p>
      <div class="f" style="margin-top:0"><label><span data-t="wish"></span> <span class="cnt" id="wishC"></span></label><textarea id="wish" maxlength="1500" style="min-height:90px"></textarea><div class="hint" data-t="wishH"></div></div>
      <ul id="todo"></ul>
      <div id="done" data-t="allDone"></div>
      <label class="consent"><input type="checkbox" id="consent"><span data-t="consent"></span></label>
      <div class="final">
        <button class="primary" id="save" data-t="save"></button>
      </div>
      <div class="hint" style="margin-top:10px;color:var(--dim);font-size:13px" data-th="saveH"></div>
    </section>
  </div>
  <footer><span data-t="foot"></span> · Builder /*__VERSION__*/</footer>
</main>
<div id="toast"></div>

<script>
const DATA=/*__DATA__*/null;
const M=DATA.meta, FR=DATA.frags, R=DATA.roster;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const LSK="hb_wanderer_builder_v1";

// ================= Texte =================
const TX={
en:{sub:"Wanderer Builder",open:"Open saved file…",random:"🎲 Random look",png:"Avatar as PNG",
introH:"Become a Wanderer",
introT:`<p>Congratulations! As a thank-you for helping with Hashiriya Battle, whether by testing or with your mods, you get to be part of the game as a <b>Wanderer</b>: a lone driver on the expressway who only shows up under certain conditions.</p>
<p>Build your driver here: your name, your avatar, your car, your plate, when you show up and what you say. Fill in as much as you can. Anything you leave open I will fill in myself.</p>
<p><b>Your car</b> has to fit the lore of the classic Genki highway battle games: a Japanese car, or an import that is sought-after in Japan. No everyday car from Europe or America, please; go for something exotic or rare.</p>
<p>When you're done, the builder saves <b>one file</b>. Send me that file, that's all. Your progress is kept in this browser, so you can close the page and continue later.</p>`,
s1:"About you",credit:"Your name for the credits",creditH:"Shown in the credits of the mod.",contact:"How can I reach you?",contactH:"Discord or BeamNG forum name, so I can ask if something is missing. Not put into the mod.",
role:"How did you contribute?",roles:{"Testing":"Testing","Mod author":"Mod author","Other":"Other"},needed:"Please fill this in.",
s2:"Your Wanderer",s2L:"Please use original names only, no names from other games. Japanese names fit the setting well.",
name:"Wanderer name",nameH:"Your driver name in Latin letters, as shown in the game. Example: Kagerō",nameTaken:"A Wanderer with this name already exists. Please pick another name.",
jp:"Name in Japanese (optional)",jpH:"Kanji, katakana or hiragana, shown small next to your name. Example: 陽炎",
nick:"Nickname / title",nickH:"Shown under your name. Example: The Heat Veil",
desc:"Your backstory",descH:"One or two sentences for the rival list. Who are you, and why do you drive the expressway at night?",
sealL:"Sign on your seal",sealH:"Every Wanderer has a round seal (like a sticker) that the player wins by beating you. 1 or 2 kanji (or up to 3 letters). Its colour is your avatar colour.",
s3:"Your avatar",s3L:"Every driver appears as a figure in the style of Bob, BeamNG's NPC: a smooth head with a dark visor, the eyes are pixels on the display. Your avatar shows up next to the speech bubble and in the rival list. Greyed-out items don't fit the rest right now; the reason is shown below them (or click the item).",
always:"",optional:"optional",
s4:"Your car and plate",
s4L:`In BeamNG, build your car (parts, tuning, paint) and save it with the <b>Vehicle Config</b> menu under any name. Then load that saved <b>.pc</b> file here.`,
source:"Your car is a …",sources:{stock:"Stock BeamNG car",mod:"Mod car"},
pcL:"Your config (.pc file)",dropT:"<b>Drag your .pc file here</b> or",pcBtn:"Choose .pc file…",
pcH:`You find it in your BeamNG user folder under <code>vehicles\\&lt;model&gt;\\</code>. Default: <code>%LOCALAPPDATA%\\BeamNG\\BeamNG.drive\\current\\vehicles\\</code> (BeamNG launcher → Manage user folder → Open user folder).`,
pasteS:"…or paste the content of the file instead",pcOk:"Config loaded",pcParts:"parts",pcPaint:"paint",pcBad:"This is not a valid BeamNG config. Pick the .pc file of your saved car.",pcNone:"No config loaded yet.",
model:"Model ID",modelH:"The car's folder name in BeamNG, e.g. sunburst2, sbr, bx. Filled in automatically from the config when possible.",modelE:"Only letters, digits and _",
modName:"Mod name",modLink:"Mod link",modH:"Mod cars are not guaranteed: if the mod isn't already part of Hashiriya Battle, I first check whether it works with the AI and ask the mod author. If it doesn't work out, I'll contact you about an alternative.",
skin:"Custom skin (optional)",skinH:"Only if you made your own skin. Name it here and send me the files. Your paint colours are already in the config.",
plateH:"License plate",plateL:"Uses Agent's Japanese Plates Pack. The hiragana character is set randomly in the game.",
region:"Region",ptype:"Type",ptop:"Top number",ptopE:"2 or 3 digits, e.g. 330",pmain:"Main number",pmainE:"Format 12-34, or with dots: .. .1",pmainH:"Low numbers use dots and a space instead of the dash, e.g. \".. .1\" or \".. 12\".",

aggrT:["Brakes early, keeps big gaps, never risks a crash.","Plays it safe, overtakes only with plenty of room.","Smooth and steady, rarely surprises anyone.","Fair racer: pushes on the straights, careful in traffic.","Brakes late, takes the inside line when it opens.","Typical Wanderer: hunts gaps, squeezes past traffic, keeps the pressure on.","Tailgates, dives into every gap, forces the player to react.","Every risk, every gap, full throttle through traffic. Crashes included."],
cruiseT:{"80":"Rolls along slowly, easy to catch.","90":"Relaxed cruising.","100":"Moves with the traffic.","110":"A little quicker than traffic.","115":"Typical Wanderer pace.","120":"Brisk, the player has to chase a bit.","130":"Fast, hard to catch up with.","140":"Flat out, only fast cars get close."},
tierT:["The player meets you from rank {r} on. Beginners can beat you.","From rank {r} on. Needs a little tuning.","From rank {r} on. A real challenge mid-game.","From rank {r} on. Needs a well-tuned car.","From rank {r} on. One of the hardest Wanderers."],
cruise:"Cruising speed before a battle (km/h)",cruiseH:"How fast you roll in traffic before the player flashes you.",

introT:`<p>Glückwunsch! Als Dankeschön für deine Hilfe bei Hashiriya Battle, ob beim Testen oder mit deinen Mods, kommst du als <b>Wanderer</b> ins Spiel: ein Einzelgänger auf der Stadtautobahn, der nur unter bestimmten Bedingungen auftaucht.</p>
<p>Hier baust du deinen Fahrer: Name, Avatar, Auto, Kennzeichen, wann du auftauchst und was du sagst. Füll so viel aus, wie du kannst. Was offen bleibt, ergänze ich selbst.</p>
<p><b>Dein Auto</b> muss zur Lore der klassischen Genki-Highway-Spiele passen: ein japanisches Auto oder ein Import, der in Japan begehrt ist. Bitte kein Alltagsauto aus Europa oder Amerika, lieber etwas Exotisches oder Seltenes.</p>
<p>Wenn du fertig bist, speichert der Builder <b>eine Datei</b>. Die schickst du mir, mehr nicht. Dein Stand bleibt in diesem Browser gespeichert, du kannst die Seite also schließen und später weitermachen.</p>`,

let LANG=(navigator.language||"en").toLowerCase().startsWith("de")?"de":"en";
const t=k=>TX[LANG][k]??TX.en[k]??k;
// Teilenamen: DE aus den Teile-Dateien, EN aus der Tabelle
function pname(kind,id){
  if(id==null)return "";
  if(kind==="eyes")return LANG==="de"?M.eyes[id]:(TX.en.N["e_"+id]||id);
  if(["tone","haircolor","beardcolor","hattone"].includes(kind))return t("C")[id]||id;
  if(LANG==="en"&&TX.en.N[id])return TX.en.N[id];
  const tbl={garment:M.garments,hair:M.hairs,hat:M.hats,glasses:M.glasses,ear:M.ears,neck:M.necks,mouth:M.mouths,beard:M.beards,lips:M.lips}[kind];
  return tbl&&tbl[id]?tbl[id].name:id;
}

// ================= Avatar zeichnen (wie make.compose / Silhouetten-Tool) =================
const TF_HEAD=`translate(0,${M.HEAD_DY})`;
const TF_FEM=`matrix(${M.FEMALE_K} 0 0 1 ${+(M.CX*(1-M.FEMALE_K)).toFixed(2)} 0)`;
function compose(s){
  const defs=[],layers=[],used=new Set();
  const fem=!!s.female, lead=!!s.leader;
  function L(name,keys,head,k){
    let body="";
    for(const key of keys){const f=FR[key];if(!f)continue;if(!used.has(key)){used.add(key);defs.push(f.defs)}body+=f.body}
    if(!body)return;
    const tf=[];if(head)tf.push(TF_HEAD);if(k&&fem)tf.push(TF_FEM);
    layers.push(`<g id="${name}"${tf.length?` transform="${tf.join(" ")}"`:""}>${body}</g>`);
  }
  L("Hintergrund",["bg"]);
  if(FR["hairb:"+s.hair].body)L("Haare_hinten",["hairb:"+s.hair],true);
  else{used.add("hairb:"+s.hair);defs.push(FR["hairb:"+s.hair].defs)}
  L("Koerper",["body"],false,true);
  const gk=`${s.garment}:${fem?1:0}:${lead?1:0}`;
  L("Oberteil",["g:"+gk],false,true);
  if(s.crew&&M.garments[s.garment].patch)L("Abzeichen",["mark:"+gk]);
  if(s.neck)L("Hals",["neck:"+s.neck],false,true);
  L("Kopf",["head"],true);
  if(s.beard&&!fem&&FR["beard:"+s.beard])L("Bart",["beard:"+s.beard],true);
  L("Visier",["visor"],true);
  L("Augen",[`eyes:${s.eyes}:${fem?1:0}`,"shine"],true);
  if(s.mask)L("Maske",["mask"],true);
  else{if(s.lips&&FR["lips:"+s.lips])L("Mundform",["lips:"+s.lips],true);if(s.mouth)L("Mund",["mouth:"+s.mouth],true)}
  L("Haare",["hairf:"+s.hair],true);
  if(s.ear)L("Ohren",["ear:"+s.ear],true);
  if(s.hat)L("Kopfbedeckung",["hat:"+s.hat],true);
  if(s.glasses)L("Brille",["gl:"+s.glasses],true);
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${M.W} ${M.H}" width="${M.W}" height="${M.H}"><defs>${defs.join("")}</defs>${layers.join("")}</svg>`;
  const T=M.tones[s.tone]||M.tones.schwarz, K=M.tones[s.hattone]||T, H=M.haircolors[s.haircolor]||M.haircolors.schwarz;
  const B=M.beardcolors[s.beardcolor||s.haircolor]||M.beardcolors.schwarz;
  const jp=[...(s.jp||"")];
  const rep={"@A@":s.A,"@T0@":T[0],"@T1@":T[1],"@K0@":K[0],"@K1@":K[1],"@H0@":H[0],"@H1@":H[1],"@B0@":B[0],"@B1@":B[1],"@E@":M.emblems[s.emblem]||M.emblems.stern,
    "@NICK@":esc(String(s.nick||"").slice(0,9)),"@TAPE@":esc(String(s.tape||"").toUpperCase().slice(0,9))};
  for(let i=0;i<8;i++)rep[`@J${i}@`]=esc(jp[i]||"");
  return svg.replace(/@(?:A|T0|T1|K0|K1|H0|H1|B0|B1|E|NICK|TAPE|J\d)@/g,m=>rep[m]);
}
const svgUrl=s=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(compose(s));

// ================= Regeln (wie make.allowed_*) =================
const FORMAL=new Set(M.formal);
function why(s,key,v){
  const g=M.garments[s.garment], h=M.hairs[s.hair], W=t("W");
  switch(key){
    case "garment":{const w=M.garments[v][s.female?"wf":"wm"];return w>0?"":(s.female?W.onlyM:W.onlyF)}
    case "hair":{const w=M.hairs[v][s.female?"wf":"wm"];return w>0?"":(s.female?W.onlyM:W.onlyF)}
    case "tone":return "";  // alle Stofffarben bei allen Oberteilen (Alex 04.11.2026)
    case "hat":{if(!v)return "";
      if(!M.hats[v].vols.includes(h.vol))return W.hatHair;
      if(v==="feldmuetze"&&s.garment!=="militaer")return W.hatField;
      const fl=[...FORMAL].map(x=>pname("garment",x)).join(", ");
      if(v==="hut"&&!FORMAL.has(s.garment))return W.hatHut.replace("{f}",fl);

const OPTS={
  garment:()=>Object.keys(M.garments), hair:()=>Object.keys(M.hairs), tone:()=>Object.keys(M.tones), hattone:()=>Object.keys(M.tones),
  haircolor:()=>Object.keys(M.haircolors), eyes:()=>Object.keys(M.eyes), hat:()=>[null,...Object.keys(M.hats)],
  glasses:()=>[null,...Object.keys(M.glasses)], ear:()=>[null,...Object.keys(M.ears)], neck:()=>[null,...Object.keys(M.necks)],
  beard:()=>[null,...Object.keys(M.beards)], beardcolor:()=>[null,...Object.keys(M.beardcolors)], lips:()=>[null,...Object.keys(M.lips)]

function fix(s){
  const out=[];
  for(const key of ["garment","hair","tone","hat","glasses","neck","beard"]){
    if(why(s,key,s[key])){
      const nv=["hat","glasses","neck","beard"].includes(key)?null:OPTS[key]().find(v=>!why(s,key,v));
      out.push(`${t("L")[key]}: ${pname(key,s[key])} → ${nv==null?t("none"):pname(key,nv)}`);
      s[key]=nv;
    }
  }
  if(s.female){s.beard=null}
  if(s.mask){s.mouth=null;s.lips=null}
  if(!s.beard)s.beardcolor=null;
  return out;
}
function pickw(list){const tot=list.reduce((a,x)=>a+x[1],0);let r=Math.random()*tot;for(const x of list){r-=x[1];if(r<=0)return x[0]}return list[list.length-1][0]}

function randomLook(s){

  s.hat=opt("hat",.3);s.glasses=opt("glasses",.3);s.neck=opt("neck",.3);s.ear=opt("ear",s.female?.45:.15);

function condBody(d){

function readCond(d,box){
  const g=sel=>box.querySelector(`[data-c="${sel}"]`);

    case "text":case "select":case "rival":return g("v").value.trim();
    case "int":return g("v").value===""?"":+g("v").value;
    case "range":return {min:g("min").value===""?"":+g("min").value,max:g("max").value===""?"":+g("max").value};
    case "stat":return {key:g("key").value,min:g("min").value===""?"":+g("min").value};
    case "multi":return [...box.querySelectorAll(".chip.on")].map(b=>{const x=b.dataset.m;return /^\d+$/.test(x)&&d.k==="weekday"?+x:x});
  }
  return true;
}

function condOut(){
  const f=st.f,c={},num=x=>x!==""&&x!=null&&isFinite(x);
  for(const d of Object.values(CDEF)){
    if(!f.cOn[d.k])continue;
    const v=f.cVal[d.k];
    switch(d.ty){
      case "bool":c[d.k]=true;break;
      case "hours":c.hours=(v||[22,4]).map(Number);break;
      case "text":if(v)c[d.k]=String(v).toLowerCase();break;
      case "int":if(num(v))c[d.k]=Math.round(+v);break;
      case "range":if(v){if(num(v.min))c[d.keys[0]]=+v.min;if(num(v.max))c[d.keys[1]]=+v.max}break;
      case "select":if(v){if(d.k==="induction"){if(v==="na")c.naOnly=true;else c.forcedInduction=true}else c[d.k]=v}break;
      case "rival":if(v)c.beatenRivals=[v];break;
      case "multi":if(v&&v.length)c[d.k]=v.length===1&&d.k!=="weekday"?v[0]:v;break;
      case "stat":if(v&&v.key&&num(v.min))c.stat={key:v.key,min:+v.min};break;
    }
  }
  return c;
}

function migrate(f){
  f.cOn=f.cOn||{};f.cVal=f.cVal||{};
  if(f.c_hours){f.cOn.hours=true;f.cVal.hours=[+f.hFrom,+f.hTo]}
  if(f.c_model){f.cOn.playerModel=true;f.cVal.playerModel=f.playerModel}
  if(f.c_part){f.cOn.playerPart=true;f.cVal.playerPart=f.playerPart}
  if(f.c_team){f.cOn.beatenTeam=true;f.cVal.beatenTeam=f.team}
  if(f.c_rival){f.cOn.beatenRivals=true;f.cVal.beatenRivals=f.rival}
  if(f.c_day){f.cOn.minDay=true;f.cVal.minDay=+f.minDay}
  for(const k of ["c_hours","hFrom","hTo","c_model","playerModel","c_part","playerPart","c_team","team","c_rival","rival","c_day","minDay"])delete f[k];
  if(typeof f.aggr!=="number"||f.aggr<1||f.aggr>8)f.aggr=6;
  return fixPlate(f);
}

const SPEC_KEYS=["garment","tone","hair","haircolor","hat","hattone","glasses","ear","neck","mask","mouth","eyes","emblem","crew","beard","beardcolor","lips"];
function buildRival(){
  const f=st.f,s=st.s, tier=TIERS[f.tier]||TIERS[2], id="w_"+slug(f.name), model=f.model.toLowerCase();
  const c=Object.assign({minRank:tier.minRank},condOut());
  const r={id,name:f.name.trim()};
  if(f.jp.trim())r.jp=f.jp.trim();
  r.nick=both(f.nick)||both(f.name);
  r.wanderer=true;r.community=true;r.model=model;
  r.config=`vehicles/${model}/hashiriya_wanderer_${slug(f.name)}.pc`;
  r.aggression=Math.round((0.3+(f.aggr-1)*0.1)*100)/100;
  r.cruiseKmh=+f.cruise||115;
  Object.assign(r,{maxSp:tier.maxSp,rewardUsd:tier.rewardUsd,rep:tier.rep});
  r.conditions=c;
  r.desc=both(f.desc)||{de:"",en:""};
  const top=f.ptop.trim(), typ=TYP_IDS[+f.ptype]||"standard";
  r.plate={text:(top.length===2?top+"//":top+"/")+f.pmain,design:typ.startsWith("am5jp_")?typ:`am5jp_${REGION_IDS[+f.region]||"shinagawa"}_${typ}`};  // Kombi ist durch validTypes immer gültig
  r.figur=s.female?"f":"m";
  const sil={};for(const k of SPEC_KEYS)sil[k]=s[k]??null;sil.A=s.A;r.silhouette=sil;
  r.seal={sign:sealSign(),color:s.A};
  r.credit={name:f.credit.trim(),role:f.role};
  const lines={};for(const [k,fk] of [["challenge","lChallenge"],["win","lWin"],["lose","lLose"]])if(both(f[fk]))lines[k]=both(f[fk]);
  if(Object.keys(lines).length)r.lines=lines;
  if(f.skin.trim())r.skin=f.skin.trim();
  if(f.source==="mod")r.requires={mods:[{name:f.modName.trim()||"?",link:f.modLink.trim()}]};
  if(f.idea.trim())r._idee=f.idea.trim();
  if(String(f.wish||"").trim())r._wunsch=String(f.wish).trim();
  r._kontakt=f.contact.trim();
  r._eingang=new Date().toISOString().slice(0,10);
  return r;
}

<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1b1d22}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1600,H=+q.get('h')||900;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0; r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x24272e);
const pm=new THREE.PMREMGenerator(r); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
const sun=new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(3,6,-4); scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshStandardMaterial({color:0x34373f,roughness:0.9}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
new GLTFLoader().load(q.get('m'),g=>{
  const o=g.scene; scene.add(o);
  const box=new THREE.Box3().setFromObject(o); const c=box.getCenter(new THREE.Vector3()); const sz=box.getSize(new THREE.Vector3());
  floor.position.y=box.min.y-0.01;
  const cam=new THREE.PerspectiveCamera(28,W/H,0.1,100);
  // view: azimuth deg (0 = from front), elevation deg
  const az=(+q.get('az')||35)*Math.PI/180, el=(+q.get('el')||14)*Math.PI/180, dist=(+q.get('d')||1)*Math.max(sz.x,sz.z)*1.55;
  // BeamNG front = -y -> glTF -z. from front = camera at -z
  cam.position.set(c.x+Math.sin(az)*Math.cos(el)*dist, c.y+Math.sin(el)*dist, c.z-Math.cos(az)*Math.cos(el)*dist);
  cam.lookAt(c.x,c.y-0.05,c.z);
  r.render(scene,cam); window.DONE=true;
});
</script></body></html>
